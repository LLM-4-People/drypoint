name: Pages

on:
  # A deployment is what Checks proved, not what a push started. Triggering on
  # the successful Checks run for main means a red commit can never be
  # published, and the commit deployed is the one that run validated.
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    # `workflow_run` fires for every conclusion; only success may deploy. A
    # manual dispatch has no triggering run, so it is always allowed.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Only this repository's main branch may deploy
        # `workflow_run` runs with the default branch's workflow file, so the
        # check that decides what code is built must itself come from main.
        # This refuses a run from a fork or from another branch before any
        # checkout happens, which is the trust boundary the workflow relies on.
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            head_repo='${{ github.event.workflow_run.head_repository.full_name }}'
            head_branch='${{ github.event.workflow_run.head_branch }}'
            if [ "$head_repo" != "$GITHUB_REPOSITORY" ] || [ "$head_branch" != "main" ]; then
              echo "::error::a Checks run from ${head_repo}:${head_branch} may not deploy this site"
              exit 1
            fi
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::a manual deploy must name refs/heads/main, not ${GITHUB_REF}"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit Checks validated. `github.sha` on a workflow_run event is
          # the default branch head, which may already have moved on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Use the pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Stage the site from the runtime file list
        run: |
          set -euo pipefail
          npm run build:brand -- --check
          npm run pages:build
          node scripts/build-pages.mjs --check
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Nothing is checked out and no shell runs here: the only job holding
      # `pages: write` executes one pinned action, so no code from any commit
      # can run with that token.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: smoke
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Use the pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Smoke-test every precached file
        env:
          RUN_ID: ${{ github.run_id }}
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_URL" ]; then
            echo "::error::the deployment page_url is empty"
            exit 1
          fi
          # The URL list is the worker's own manifest, not a hand-picked few:
          # a deployment that forgets one file fails here instead of on a
          # phone. Each URL is retried a bounded number of times and the
          # manifest's content type is checked too.
          node scripts/smoke-pages.mjs --base "$BASE_URL" --cache-bust "$RUN_ID"
