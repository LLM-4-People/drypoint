name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The environment (and, once they are moved, its secrets) is scoped to a
    # `v*` tag policy in the repository settings; a branch cannot use it.
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # The release must be built by the same toolchain the pull-request gate
      # proves, not by whatever the runner happens to preinstall.
      ANDROID_PLATFORM: android-36
      ANDROID_BUILD_TOOLS: '36.0.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The ancestry check below needs the history and the tags, which a
          # depth-1 clone that fetches one tag does not have.
          fetch-depth: 0
          fetch-tags: true
      - name: The tagged commit is on main
        run: |
          set -euo pipefail
          git rev-parse --verify origin/main > /dev/null
          # A tag must name a commit main contains. With a shallow clone this
          # check cannot answer, which is why the checkout fetches everything:
          # refusing is the safe answer, never "assume it is on main".
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main; a tag off main may not publish"
            exit 1
          fi
          echo "$GITHUB_SHA is on main"
      - name: Use the pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Use JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the pinned SDK packages
        run: bash scripts/android-sdk.sh
      - name: The tagged commit passes every gate
        run: |
          set -euo pipefail
          # The same gate a pull request runs: brand, precache, privacy, tests,
          # docs and workflow policy. A tag cannot publish a red commit.
          npm run verify:all
          node scripts/release-notes.mjs --tag "$GITHUB_REF_NAME" --out "$RUNNER_TEMP/notes.md"
      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; a release must be signed by the project key"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build, sign and package the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # The build refuses to invent a key when CI is set, and compares the
          # signing certificate with brand.json.
          CI: 'true'
        run: |
          set -euo pipefail
          npm run build:android
          version="$(node -p "require('./package.json').version")"
          apk="android/build/drypoint-${version}.apk"
          test -f "$apk"
          mkdir -p dist
          cp "$apk" "dist/drypoint-${version}.apk"
          (
            cd dist
            sha256sum "drypoint-${version}.apk" > "drypoint-${version}.apk.sha256"
            cat "drypoint-${version}.apk.sha256"
          )
      - name: Attest the APK's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/drypoint-*.apk
      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drypoint-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: The build changed no tracked file
        run: git diff --exit-code
      - name: The build left no untracked file
        run: test -z "$(git status --porcelain)"

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drypoint-release
          path: dist
      - name: Release notes from the changelog
        run: node scripts/release-notes.mjs --tag "$GITHUB_REF_NAME" --out "$RUNNER_TEMP/notes.md"
      - name: Publish the release, or prove it already is
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          apk="dist/drypoint-${version}.apk"
          checksum="${apk}.sha256"

          # A re-run of this workflow for the same tag must not fail, and must
          # not silently accept a release that carries different bytes. It
          # exits 0 only when the existing release's assets match the ones this
          # run built and verified.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/existing" --clobber
            for asset in "drypoint-${version}.apk" "drypoint-${version}.apk.sha256"; do
              if ! cmp -s "dist/${asset}" "$RUNNER_TEMP/existing/${asset}"; then
                echo "::error::the existing release asset ${asset} differs from this build"
                exit 1
              fi
            done
            echo "::notice::release $GITHUB_REF_NAME already exists with these exact assets"
            exit 0
          fi

          # Tags are strict vMAJOR.MINOR.PATCH (release-notes.mjs refuses
          # anything else), so a prerelease tag cannot reach this point.
          gh release create \
            "$GITHUB_REF_NAME" \
            "$apk" \
            "$checksum" \
            --verify-tag \
            --title "v${version}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
