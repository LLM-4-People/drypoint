name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # The release must be built by the same toolchain the pull-request gate
      # proves, not by whatever the runner happens to preinstall.
      ANDROID_PLATFORM: android-36
      ANDROID_BUILD_TOOLS: '36.0.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Use JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the pinned SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$sdkmanager" ]; then
            echo "::error::sdkmanager not found; set ANDROID_HOME to an SDK with cmdline-tools"
            exit 1
          fi
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS"
      - name: The tagged commit passes every gate
        run: |
          set -euo pipefail
          # The same gate a pull request runs: brand, precache, privacy, tests,
          # docs and workflow policy. A tag cannot publish a red commit.
          npm run verify
          node scripts/release-notes.mjs --tag "$GITHUB_REF_NAME" --out "$RUNNER_TEMP/notes.md"
      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; a release must be signed by the project key"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build, sign and package the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # The build refuses to invent a key when CI is set.
          CI: 'true'
        run: |
          set -euo pipefail
          npm run build:android
          version="$(node -p "require('./package.json').version")"
          apk="android/build/drypoint-${version}.apk"
          test -f "$apk"
          mkdir -p dist
          cp "$apk" "dist/drypoint-${version}.apk"
          (
            cd dist
            sha256sum "drypoint-${version}.apk" > "drypoint-${version}.apk.sha256"
            cat "drypoint-${version}.apk.sha256"
          )
      - name: Attest the APK's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/drypoint-*.apk
      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drypoint-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: The build changed no tracked file
        run: git diff --exit-code

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drypoint-release
          path: dist
      - name: Release notes from the changelog
        run: node scripts/release-notes.mjs --tag "$GITHUB_REF_NAME" --out "$RUNNER_TEMP/notes.md"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          args=(
            "$GITHUB_REF_NAME"
            "dist/drypoint-${version}.apk"
            "dist/drypoint-${version}.apk.sha256"
            --verify-tag
            --title "v${version}"
            --notes-file "$RUNNER_TEMP/notes.md"
          )
          case "$GITHUB_REF_NAME" in
            *-*) args+=(--prerelease) ;;
            *) args+=(--latest) ;;
          esac
          # Never a draft: the tag proves itself or nothing is published.
          gh release create "${args[@]}"
