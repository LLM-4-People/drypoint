name: Release

# This workflow is read from `main`, not from the tag it releases. A tag can
# only supply a commit for the resolve step to verify; it cannot redefine the
# signing logic. The key is visible only in the `sign` job, whose steps are all
# workflow-owned commands, so no process started by repository code can read it.
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vMAJOR.MINOR.PATCH) or full 40-character commit SHA for a dry run
        required: true
        type: string
      publish:
        description: Publish the release (false builds and signs only)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A failed, cancelled or pull-request Checks run must not reach the tag
    # lookup: a failed tag run still has the tag at head_sha and would
    # otherwise publish. A normal main push resolves to publish=false.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    outputs:
      publish: ${{ steps.tag.outputs.publish }}
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      version: ${{ steps.tag.outputs.version }}
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - name: Checkout main with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Resolve the tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          out() { printf '%s\n' "$1" >> "$GITHUB_OUTPUT"; }

          if [ "$EVENT" = workflow_dispatch ]; then
            input="$INPUT_TAG"
            # A full SHA is the pre-tag dry run: the commit is built and signed,
            # but a synthetic tag name is never treated as a real tag.
            if [[ "$input" =~ ^[0-9a-f]{40}$ ]]; then
              if [ "$INPUT_PUBLISH" = true ]; then
                echo "::error::publish=true requires a release tag, not the commit $input; a SHA dry run never publishes"
                exit 1
              fi
              if ! git cat-file -e "${input}^{commit}" 2>/dev/null; then
                echo "::error::commit $input does not exist in this repository"
                exit 1
              fi
              if ! git merge-base --is-ancestor "$input" origin/main; then
                echo "::error::$input is not an ancestor of origin/main"
                exit 1
              fi
              sha="$input"
              version="$(git show "$sha:package.json" | jq -r .version)"
              if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::package.json at $sha has no strict semantic version (got $version)"
                exit 1
              fi
              # The tag is the notes and version binding only; the commit is
              # what gets checked out, and nothing is published.
              tag="v$version"
              ref="$sha"
              publish=false
            elif [[ "$input" =~ ^[0-9a-f]{7,39}$ ]]; then
              echo "::error::commit $input is not a full 40-character SHA; pass the full SHA for a dry run"
              exit 1
            else
              tag="$input"
              if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::$tag is not a strict release tag or a full 40-character commit SHA"
                exit 1
              fi
              if ! git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null; then
                echo "::error::tag $tag does not exist"
                exit 1
              fi
              sha="$(git rev-list -n1 "$tag")"
              if ! git merge-base --is-ancestor "$sha" origin/main; then
                echo "::error::$sha is not an ancestor of origin/main"
                exit 1
              fi
              version="$(git show "$tag:package.json" | jq -r .version)"
              if [ "$version" != "${tag#v}" ]; then
                echo "::error::tag $tag does not match package.json version $version"
                exit 1
              fi
              ref="$tag"
              publish="$INPUT_PUBLISH"
            fi
          else
            # A tag that points at main HEAD produces two successful Checks
            # runs for one commit (the branch push and the tag push). Deriving
            # the tag from the commit makes both runs agree without depending
            # on head_branch.
            sha="$RUN_SHA"
            mapfile -t tags < <(git tag --points-at "$sha" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
            if [ "${#tags[@]}" -eq 0 ]; then
              out "publish=false"
              echo "no release tag at $sha"
              exit 0
            fi
            if [ "${#tags[@]}" -ne 1 ]; then
              echo "::error::multiple release tags at $sha: ${tags[*]}"
              exit 1
            fi
            tag="${tags[0]}"
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "::error::$sha is not an ancestor of origin/main"
              exit 1
            fi
            version="$(git show "$tag:package.json" | jq -r .version)"
            if [ "$version" != "${tag#v}" ]; then
              echo "::error::tag $tag does not match package.json version $version"
              exit 1
            fi
            ref="$tag"
            publish=true
          fi

          out "publish=$publish"
          out "tag=$tag"
          out "sha=$sha"
          out "version=$version"
          out "ref=$ref"

  build:
    name: build
    needs: resolve
    # A workflow_run with no tag stops after resolve. A manual dispatch always
    # builds, so a SHA dry run knows the tree passes before a tag exists.
    if: needs.resolve.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    # The digest is the sign job's independent reference. It comes from the
    # step that wrote the APK, not from the checksum file in the artifact.
    outputs:
      unsigned_sha256: ${{ steps.package.outputs.unsigned_sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      SHA: ${{ needs.resolve.outputs.sha }}
      VERSION: ${{ needs.resolve.outputs.version }}
      ANDROID_PLATFORM: android-36
      ANDROID_BUILD_TOOLS: '36.0.0'
    steps:
      - name: Checkout main
        # The release ref is materialized as a worktree below. The build job's
        # own checkout is a fixed ref, so the dynamic tag/SHA is data for git,
        # not a checkout target CodeQL has to treat as a poisoned cache source.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Materialize the resolved commit
        env:
          REF: ${{ needs.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          worktree="$RUNNER_TEMP/release"
          git worktree add --detach "$worktree" "$REF"
          printf 'RELEASE_TREE=%s\n' "$worktree" >> "$GITHUB_ENV"
      - name: Prove the worktree is the resolved commit
        # A2-V8: the dynamic actions/checkout sink is gone; this runtime
        # assertion is the integrity property CodeQL's dismissal relies on.
        # `$REF` is a tag or a full SHA, and `$SHA` is the commit resolve
        # verified; a moved tag or a stale worktree fails here.
        working-directory: ${{ env.RELEASE_TREE }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Use the pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ env.RELEASE_TREE }}/.node-version
      - name: Install the one dev-only dependency
        working-directory: ${{ env.RELEASE_TREE }}
        run: npm ci
      - name: Locate a Chromium binary
        working-directory: ${{ env.RELEASE_TREE }}
        run: node scripts/find-chrome.mjs
      - name: Gate the resolved tree
        working-directory: ${{ env.RELEASE_TREE }}
        env:
          CI: 'true'
        run: npm run verify:all
      - name: Release notes from the changelog
        working-directory: ${{ env.RELEASE_TREE }}
        run: mkdir -p dist
      - name: Generate the notes
        working-directory: ${{ env.RELEASE_TREE }}
        run: node scripts/release-notes.mjs --tag "$TAG" --commit "$SHA" --out dist/notes.md
      - name: Use JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the pinned SDK packages
        working-directory: ${{ env.RELEASE_TREE }}
        run: bash scripts/android-sdk.sh
      - name: Create a throwaway signing key
        # The build job holds no release secret. The one shared script creates
        # the throwaway key the unsigned artifact is signed with; the sign job
        # replaces that signature with the project key.
        working-directory: ${{ env.RELEASE_TREE }}
        run: node scripts/ci-keystore.mjs
      - name: Build the unsigned APK with a throwaway key
        working-directory: ${{ env.RELEASE_TREE }}
        run: npm run build:android
      - name: Package the unsigned artifact
        id: package
        working-directory: ${{ env.RELEASE_TREE }}
        run: |
          set -euo pipefail
          apk="android/build/drypoint-${VERSION}.apk"
          test -f "$apk"
          cp "$apk" "dist/drypoint-${VERSION}-unsigned.apk"
          (
            cd dist
            sha256sum "drypoint-${VERSION}-unsigned.apk" > "drypoint-${VERSION}-unsigned.apk.sha256"
            cat "drypoint-${VERSION}-unsigned.apk.sha256"
          )
          # The job output is the digest of the exact bytes this step wrote.
          # The sign job compares its download against this value, so a
          # checksum shipped inside the same artifact cannot vouch for it.
          printf 'unsigned_sha256=%s\n' "$(sha256sum "dist/drypoint-${VERSION}-unsigned.apk" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          # Data for the sign job's independent package and certificate checks.
          # It is read with jq there, never executed. The version code and the
          # signing-scheme answer come from the one owner of each rule, not a
          # second copy in the sign job.
          node scripts/build-android.mjs --version-code > dist/version-code.txt
          node scripts/build-android.mjs --signing-scheme > dist/signing.json
          cp brand.json dist/brand.json
      - name: Write the provenance predicate
        # The attest action's default predicate comes from github.context, where
        # a workflow_run sees the default-branch HEAD. This predicate names the
        # resolved tag commit and is passed to the action as data.
        working-directory: ${{ env.RELEASE_TREE }}
        run: node scripts/release-provenance.mjs --sha "$SHA" --tag "$TAG" --version "$VERSION" --out dist/provenance.json
      - name: The build changed no tracked file
        working-directory: ${{ env.RELEASE_TREE }}
        run: git diff --exit-code
      - name: The build left no untracked file
        working-directory: ${{ env.RELEASE_TREE }}
        run: test -z "$(git status --porcelain)"
      - name: The built APK matches its manifest and policy
        working-directory: ${{ env.RELEASE_TREE }}
        run: |
          set -euo pipefail
          node scripts/check-apk.mjs \
            --apk "dist/drypoint-${VERSION}-unsigned.apk" \
            --aapt2 "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt2" \
            --apksigner "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
      - name: Upload the unsigned artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drypoint-unsigned
          path: ${{ env.RELEASE_TREE }}/dist/*
          if-no-files-found: error
          retention-days: 7

  sign:
    name: sign
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The only job that can read the signing key. Every command in it is
    # written here; no checkout and no repository script runs in this job.
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      SHA: ${{ needs.resolve.outputs.sha }}
      # The build's own digest of the unsigned APK. The checksum file inside the
      # artifact is written by the same job as the APK, so this separate value
      # is what proves the downloaded bytes are the built bytes.
      UNSIGNED_SHA256: ${{ needs.build.outputs.unsigned_sha256 }}
      EXPECTED_CERT: ${{ vars.RELEASE_CERT_SHA256 }}
      ANDROID_PLATFORM: android-36
      ANDROID_BUILD_TOOLS: '36.0.0'
    steps:
      - name: Download the unsigned artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drypoint-unsigned
          path: dist
      - name: Use the gate-proved JDK
        # `apksigner` and `sdkmanager` come from the same pinned Temurin 21 the
        # build used; the runner default is not a toolchain the gate proved.
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the pinned build tools
        # Workflow-owned copy of scripts/android-sdk.sh's package list; a test
        # keeps the two lists equal so they cannot drift.
        run: |
          set -euo pipefail
          sdkmanager="$(command -v sdkmanager)"
          "$sdkmanager" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"
      - name: Sign, verify and describe the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          unsigned="dist/drypoint-${VERSION}-unsigned.apk"
          signed="dist/drypoint-${VERSION}.apk"
          notes="dist/notes.md"
          brand="dist/brand.json"
          trap 'rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/ks-pass" "$RUNNER_TEMP/key-pass" "$RUNNER_TEMP/signed.apk"' EXIT

          # The build-exposed digest is the independent reference. The checksum
          # file in this artifact was written by the job that wrote the APK, so
          # it cannot detect a substituted APK; this value can.
          if [ -z "${UNSIGNED_SHA256:-}" ]; then
            echo "::error::the build did not expose the unsigned APK digest"
            exit 1
          fi
          unsigned_sha="$(sha256sum "$unsigned" | awk '{print $1}')"
          if [ "$unsigned_sha" != "$UNSIGNED_SHA256" ]; then
            echo "::error::the downloaded APK $unsigned_sha is not the build's $UNSIGNED_SHA256"
            exit 1
          fi
          test -f "$notes"
          test -f "$brand"
          # The build wrote both answers from their one owners: the versionCode
          # arithmetic in build-android.mjs and the manifest's minSdk. The sign
          # job reads them with jq/cat, never re-derives them.
          test -f dist/version-code.txt
          test -f dist/signing.json
          expected_version_code="$(cat dist/version-code.txt)"
          min_sdk="$(jq -r .minSdkVersion dist/signing.json)"
          v1_signing="$(jq -r .v1SigningEnabled dist/signing.json)"
          if ! [[ "$expected_version_code" =~ ^[0-9]+$ ]] || ! [[ "$min_sdk" =~ ^[0-9]+$ ]] || ! [[ "$v1_signing" =~ ^(true|false)$ ]]; then
            echo "::error::the build did not publish a valid versionCode/signing scheme"
            exit 1
          fi
          if [ -z "${EXPECTED_CERT:-}" ]; then
            echo "::error::RELEASE_CERT_SHA256 is not pinned in the release environment"
            exit 1
          fi
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; a release must be signed by the project key"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/ks-pass"
          printf '%s' "$ANDROID_KEYSTORE_KEY_PASSWORD" > "$RUNNER_TEMP/key-pass"
          chmod 600 "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/ks-pass" "$RUNNER_TEMP/key-pass"

          "$tools/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "file:$RUNNER_TEMP/ks-pass" \
            --key-pass "file:$RUNNER_TEMP/key-pass" \
            --min-sdk-version "$min_sdk" \
            --v1-signing-enabled "$v1_signing" \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$signed" \
            "$unsigned"

          verify="$("$tools/apksigner" verify --verbose --print-certs "$signed")"
          printf '%s\n' "$verify"
          printf '%s\n' "$verify" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          printf '%s\n' "$verify" | grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true'

          signer="$(printf '%s\n' "$verify" | grep -oE 'Signer #1 certificate SHA-256 digest: [0-9a-f]{64}' | awk '{print $NF}')"
          if [ "$signer" != "$EXPECTED_CERT" ]; then
            echo "::error::the APK signer $signer is not the pinned $EXPECTED_CERT"
            exit 1
          fi
          # brand.json is repository data, read with jq and never executed. A
          # silent fingerprint drift must fail even when the key itself is
          # right, because the downloader reads this file.
          brand_cert="$(jq -r .androidSigningCertificateSha256 "$brand")"
          if [ "$brand_cert" != "$EXPECTED_CERT" ]; then
            echo "::error::brand.json records $brand_cert, not the environment pin $EXPECTED_CERT"
            exit 1
          fi
          notes_cert="$(grep -F 'Signing certificate SHA-256' "$notes" | grep -oE '[0-9a-f]{64}' | tail -1)"
          if [ "$notes_cert" != "$EXPECTED_CERT" ]; then
            echo "::error::the release notes name $notes_cert, not the environment pin $EXPECTED_CERT"
            exit 1
          fi

          "$tools/zipalign" -c -v 4 "$signed" > /dev/null
          badging="$("$tools/aapt2" dump badging "$signed")"
          package_id="$(jq -r .appId "$brand")"
          # The exact package, versionCode and versionName: the same values
          # check-apk asserts against the unsigned artifact. A hard-coded
          # versionCode fails here even when it is positive.
          expected_package="package: name='${package_id}' versionCode='${expected_version_code}' versionName='${VERSION}'"
          if ! printf '%s\n' "$badging" | grep -qF "$expected_package"; then
            echo "::error::the APK does not carry ${expected_package}"
            exit 1
          fi
          if printf '%s\n' "$badging" | grep -q 'android.permission.INTERNET'; then
            echo "::error::the APK requests android.permission.INTERNET"
            exit 1
          fi
          launchers="$(printf '%s\n' "$badging" | grep -c "^launchable-activity: name='")"
          if [ "$launchers" -ne 1 ]; then
            echo "::error::the APK must have exactly one MAIN/LAUNCHER activity, found $launchers"
            exit 1
          fi

          xmltree="$("$tools/aapt2" dump xmltree --file AndroidManifest.xml "$signed")"
          printf '%s\n' "$xmltree" | grep -qE 'android:allowBackup\([^)]*\)=(false|\(type 0x12\)0x0)'
          if printf '%s\n' "$xmltree" | grep -q 'android:debuggable'; then
            echo "::error::the APK is debuggable"
            exit 1
          fi
          if printf '%s\n' "$xmltree" | grep -q 'android:usesCleartextTraffic'; then
            echo "::error::the APK allows cleartext traffic"
            exit 1
          fi
          if printf '%s\n' "$xmltree" | grep -q 'android.permission.INTERNET'; then
            echo "::error::the manifest grants android.permission.INTERNET"
            exit 1
          fi
          if printf '%s\n' "$xmltree" | grep -qE 'E: (provider|service|receiver)( |$)'; then
            echo "::error::the APK declares a provider, service or receiver"
            exit 1
          fi
          activities="$(printf '%s\n' "$xmltree" | grep -cE 'E: activity( |$)')"
          exported="$(printf '%s\n' "$xmltree" | grep -cE 'android:exported\([^)]*\)=true')"
          if [ "$activities" -ne 1 ] || [ "$exported" -ne 1 ]; then
            echo "::error::the APK must have one activity and one exported component (activities=$activities exported=$exported)"
            exit 1
          fi
          if ! printf '%s\n' "$xmltree" | grep -q 'android.intent.action.MAIN'; then
            echo "::error::the launcher activity has no MAIN action"
            exit 1
          fi
          if ! printf '%s\n' "$xmltree" | grep -q 'android.intent.category.LAUNCHER'; then
            echo "::error::the launcher activity has no LAUNCHER category"
            exit 1
          fi

          (
            cd dist
            sha256sum "drypoint-${VERSION}.apk" > "drypoint-${VERSION}.apk.sha256"
            cat "drypoint-${VERSION}.apk.sha256"
          )
      - name: Attest the signed APK
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/drypoint-${{ needs.resolve.outputs.version }}.apk
          # A custom SLSA predicate from the build tree, so the attested commit
          # is needs.resolve.outputs.sha. The default predicate reads
          # github.context, which is the default-branch HEAD for workflow_run.
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: dist/provenance.json
      - name: Download the provenance bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A dedicated empty directory: a file already in dist/ cannot be
          # selected instead of the bundle this run downloads.
          rm -rf dist/attest
          mkdir -p dist/attest
          (
            cd dist/attest
            gh attestation download "drypoint-${VERSION}.apk" -R "$GITHUB_REPOSITORY"
          )
          shopt -s nullglob
          files=(dist/attest/*.jsonl)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::gh attestation download wrote ${#files[@]} bundles; exactly one is required"
            exit 1
          fi
          mv "${files[0]}" "dist/drypoint-${VERSION}.apk.intoto.jsonl"
          test -f "dist/drypoint-${VERSION}.apk.intoto.jsonl"
      - name: Prove the provenance binds the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle="dist/drypoint-${VERSION}.apk.intoto.jsonl"
          apk="dist/drypoint-${VERSION}.apk"
          apk_sha="$(sha256sum "dist/drypoint-${VERSION}.apk" | awk '{print $1}')"
          # Verify the Sigstore bundle and the signer workflow before parsing
          # it. `--format json` returns only the attestations that passed that
          # verification, so a forged line appended to the bundle is never
          # considered by the assertion below.
          gh attestation verify "$apk" \
            --bundle "$bundle" \
            -R "$GITHUB_REPOSITORY" \
            --signer-workflow "LLM-4-People/drypoint/.github/workflows/release.yml" \
            --predicate-type "https://slsa.dev/provenance/v1" \
            --format json > "$RUNNER_TEMP/verified.json"
          # The DSSE payload is the in-toto statement. At least one verified
          # statement for this exact APK digest must carry exactly one
          # dependency and it must be the resolved commit. A prior dry run or
          # GitHub's automatic release attestation may add statements; they
          # cannot satisfy the binding unless they name this commit.
          if ! jq -e --arg sha "$SHA" --arg apk "$apk_sha" '
            [ .[]
              | .attestation.bundle.dsseEnvelope.payload
              | @base64d | fromjson
              | select(.subject[0].digest.sha256 == $apk)
            ] as $statements
            | ($statements | length) >= 1
              and any($statements[];
                (.predicate.buildDefinition.resolvedDependencies // []) as $dependencies
                | ($dependencies | length) == 1
                  and $dependencies[0].digest.gitCommit == $sha)
          ' "$RUNNER_TEMP/verified.json" > /dev/null; then
            echo "::error::the provenance does not bind the signed APK to the resolved commit $SHA"
            exit 1
          fi
          echo "provenance binds $apk_sha to $SHA"
      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drypoint-release
          path: |
            dist/drypoint-${{ needs.resolve.outputs.version }}.apk
            dist/drypoint-${{ needs.resolve.outputs.version }}.apk.sha256
            dist/drypoint-${{ needs.resolve.outputs.version }}.apk.intoto.jsonl
            dist/notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [resolve, sign]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that can write the release. It holds no secret, checks out
    # nothing and runs no repository code: the assets are the sign job's bytes.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # The publish job has no checkout, so `gh` cannot discover a repository
      # from the working directory. One job-level owner for the target.
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drypoint-release
          path: dist
      - name: Publish the release, or prove it already is
        run: |
          set -euo pipefail
          apk="dist/drypoint-${VERSION}.apk"
          checksum="${apk}.sha256"
          bundle="dist/drypoint-${VERSION}.apk.intoto.jsonl"
          notes="dist/notes.md"
          for file in "$apk" "$checksum" "$bundle" "$notes"; do test -f "$file"; done

          # A re-run of this workflow for the same tag must not fail, and must
          # not silently accept a release that carries different bytes. It
          # exits 0 only when the existing release's assets match the ones this
          # run built and verified.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release download "$TAG" --dir "$RUNNER_TEMP/existing" --clobber
            # The APK and its checksum are reproducible: compare those bytes.
            for asset in \
              "drypoint-${VERSION}.apk" \
              "drypoint-${VERSION}.apk.sha256"; do
              if ! cmp -s "dist/${asset}" "$RUNNER_TEMP/existing/${asset}"; then
                echo "::error::the existing release asset ${asset} differs from this build"
                exit 1
              fi
            done
            # The attestation bundle is not reproducible: every signing makes a
            # fresh certificate and signature, and GitHub adds its own release
            # attestation. Verify the published APK against the repository and
            # the signer workflow, then require a statement for its exact
            # digest that binds this commit, instead of comparing bundle bytes.
            existing_apk="$RUNNER_TEMP/existing/drypoint-${VERSION}.apk"
            existing_bundle="$RUNNER_TEMP/existing/drypoint-${VERSION}.apk.intoto.jsonl"
            existing_sha="$(sha256sum "$existing_apk" | awk '{print $1}')"
            # Only the attestations gh verified are parsed; a forged line in the
            # downloaded bundle is not in this output.
            gh attestation verify "$existing_apk" \
              --bundle "$existing_bundle" \
              -R "$GITHUB_REPOSITORY" \
              --signer-workflow "LLM-4-People/drypoint/.github/workflows/release.yml" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --format json > "$RUNNER_TEMP/verified.json"
            if ! jq -e --arg sha "$SHA" --arg apk "$existing_sha" '
              [ .[]
                | .attestation.bundle.dsseEnvelope.payload
                | @base64d | fromjson
                | select(.subject[0].digest.sha256 == $apk)
              ] as $statements
              | ($statements | length) >= 1
                and any($statements[];
                  (.predicate.buildDefinition.resolvedDependencies // []) as $dependencies
                  | ($dependencies | length) == 1
                    and $dependencies[0].digest.gitCommit == $sha)
            ' "$RUNNER_TEMP/verified.json" > /dev/null; then
              echo "::error::the existing release attestation does not bind the published APK to the resolved commit $SHA"
              exit 1
            fi
            # The assets are immutable, the body is not. A re-run with a changed
            # changelog must not exit 0 while the published notes still lie.
            gh release edit "$TAG" --notes-file "$notes"
            echo "::notice::release $TAG already exists with these exact assets; notes refreshed"
            exit 0
          fi

          # Tags are strict vMAJOR.MINOR.PATCH and the resolve step verified the
          # tag's own tree, so this command only ever creates the release the
          # build job proved.
          gh release create "$TAG" \
            "$apk" \
            "$checksum" \
            "$bundle" \
            --verify-tag \
            --title "v${VERSION}" \
            --notes-file "$notes" \
            --latest
