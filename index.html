<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08080a" />
    <meta name="description" content="Design and print 12 mm labels on a NIIMBOT D110, entirely offline." />
    <title>Drypoint</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text">Drypoint</span>
        </div>

        <div class="topbar-center">
          <input id="docName" class="doc-name" aria-label="Label name" spellcheck="false" />
        </div>

        <div class="topbar-actions">
          <button id="undoButton" class="icon-btn" type="button" title="Undo (Ctrl Z)" aria-label="Undo"></button>
          <button id="redoButton" class="icon-btn" type="button" title="Redo (Ctrl Shift Z)" aria-label="Redo"></button>
          <span class="divider" aria-hidden="true"></span>
          <button id="deviceButton" class="device-pill" type="button">
            <span class="dot" id="deviceDot" data-state="offline"></span>
            <span id="deviceLabel">Connect printer</span>
          </button>
          <button id="settingsButton" class="icon-btn" type="button" title="Settings" aria-label="Settings"></button>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar">
          <div class="rail" id="toolRail" role="group" aria-label="Add element"></div>

          <section class="panel layers-panel">
            <div class="panel-head">
              <h2>Layers</h2>
              <span class="hint" id="layerCount"></span>
            </div>
            <ul class="layer-list" id="layerList" aria-label="Layers" tabindex="-1"></ul>
          </section>

          <section class="panel templates-panel">
            <div class="panel-head"><h2>Templates</h2></div>
            <div class="template-grid" id="templateList"></div>
          </section>
        </aside>

        <main class="stage">
          <div class="stage-bar">
            <div class="stage-bar-group">
              <span class="badge" id="labelSize">12 × 40 mm</span>
              <span class="hint" id="labelPx"></span>
            </div>
            <div class="stage-name" id="stageNameSlot"></div>
            <div class="stage-bar-group" id="zoomControls"></div>
          </div>

          <div class="stage-scroll" id="stageScroll">
            <div class="canvas-stack">
              <canvas id="labelCanvas" class="label-canvas"></canvas>
              <canvas id="overlayCanvas" class="overlay-canvas"></canvas>
            </div>
          </div>

          <div class="stage-foot">
            <span class="hint" id="stageHint" role="status"></span>
          </div>
        </main>

        <aside class="inspector">
          <div class="tabs" id="panelTabs" role="tablist" aria-label="Inspector">
            <button type="button" id="tab-design" data-tab="design" role="tab" aria-selected="true" aria-controls="panelBody" tabindex="0">Design</button>
            <button type="button" id="tab-print" data-tab="print" role="tab" aria-selected="false" aria-controls="panelBody" tabindex="-1">Print</button>
          </div>
          <div class="panel-body" id="panelBody" role="tabpanel" aria-labelledby="tab-design"></div>
        </aside>
      </div>

      <footer class="actionbar">
        <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
        <div class="action-row">
          <span class="status" id="status" role="status"></span>
          <button id="testButton" class="ghost" type="button">Test label</button>
          <button id="printButton" class="primary" type="button">Print</button>
        </div>
      </footer>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div id="modalRoot"></div>

    <script src="src/vendor/qrcode.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
